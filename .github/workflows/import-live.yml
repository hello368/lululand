name: Import live site (one-time)

on:
  workflow_dispatch:
    inputs:
      zip_name:
        description: "Temporary zip filename in public_html"
        required: true

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and unpack
        run: |
          curl -fSL "https://lululandkids.com/${{ inputs.zip_name }}" -o /tmp/site.zip
          rm -rf site && mkdir site
          unzip -q /tmp/site.zip -d site
          rm -f site/import-*.zip
          find site -maxdepth 1 | head -50
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site
          git commit -m "Import live site from lululandkids.com [skip ci]" || echo "nothing to commit"
          git push
